<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker V3</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface: #111111;
            --surface-border: #333333;
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --accent: #ffffff;
            --accent-text: #000000;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h2 { font-weight: 600; margin-bottom: 2rem; text-align: center; }

        .screen { display: none; width: 100%; max-width: 480px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button { 
            display: block; width: 100%; padding: 1rem; margin-bottom: 1rem; 
            font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 8px; 
            border: 1px solid var(--surface-border); background: var(--surface); 
            color: var(--text-primary); transition: all 0.2s ease;
        }
        button:hover { border-color: var(--text-secondary); }
        
        button.primary-action { background: var(--accent); color: var(--accent-text); border: none; }
        button.primary-action:hover { opacity: 0.9; transform: scale(0.98); }
        
        button.secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--surface-border); }
        button.secondary:hover { color: var(--text-primary); }

        .exercise-card { 
            background: var(--surface); padding: 1.5rem; margin-bottom: 1rem; 
            border-radius: 12px; border: 1px solid var(--surface-border); text-align: left; 
        }
        .exercise-card h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }

        /* UI Cerchi per le serie */
        .sets-indicator { display: flex; gap: 8px; margin: 15px 0; }
        .set-circle {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid var(--accent); background: transparent;
            transition: background 0.3s ease;
        }
        .set-circle.filled { background: var(--accent); }

        /* Timer a schermo intero */
        .timer-fullscreen { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: var(--bg-color); z-index: 1000; display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .timer-fullscreen.active { display: flex; }
        .timer-time { 
            font-size: 5.5rem; font-weight: bold; font-variant-numeric: tabular-nums; 
            color: var(--accent); margin-bottom: 3rem; 
        }
        .timer-controls { display: flex; gap: 1rem; width: 100%; max-width: 400px; padding: 0 1rem; box-sizing: border-box;}
        .timer-controls button { margin: 0; }

        .completed { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Schermate 1 e 2 -->
    <div id="screen-person" class="screen active">
        <h2>Chi si allena oggi?</h2>
        <button onclick="selectPerson('giuseppe')">Giuseppe</button>
        <button onclick="selectPerson('alfonso')">Alfonso</button>
    </div>

    <div id="screen-day" class="screen">
        <h2>Seleziona il Giorno</h2>
        <button onclick="selectDay(1)">Giorno 1: Upper Body</button>
        <button onclick="selectDay(2)">Giorno 2: Lower Body & Core</button>
        <button onclick="selectDay(3)">Giorno 3: Full Body & Cardio</button>
        <button class="secondary" onclick="showScreen('screen-person')">Indietro</button>
    </div>

    <!-- Schermata 3 -->
    <div id="screen-workout" class="screen">
        <h2 id="workout-title">Allenamento</h2>
        <button class="secondary" onclick="showScreen('screen-day')" style="margin-bottom: 2rem;">Cambia Giorno</button>
        <div id="workout-list"></div>
    </div>

    <!-- Timer Schermo Intero -->
    <div id="timer-fullscreen" class="timer-fullscreen">
        <h2 style="color: var(--text-secondary);">Recupero</h2>
        <div id="timer-time" class="timer-time">00:00</div>
        <div class="timer-controls">
            <button id="btn-pause" class="secondary" onclick="togglePause()">Pausa</button>
            <button class="primary-action" onclick="cancelTimer()">Chiudi</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
